<!DOCTYPE html>
<html lang="en">
<head>
	<title>Westernome - Register</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="vendor/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="fonts/font-awesome-4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" type="text/css" href="css/util.css">
	<link rel="stylesheet" type="text/css" href="css/main.css">
	<style>
		.alert-custom {
			background-color: #f8d7da; color: #721c24; padding: 10px;
			border-radius: 25px; text-align: center; margin-top: 15px;
			font-size: 14px; border: 1px solid #f5c6cb;
		}
	</style>
</head>
<body>
	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100">
				<div class="login100-pic js-tilt" data-tilt>
					<img src="images/img-01.png" alt="IMG">
				</div>

				<form id="registerForm" class="login100-form validate-form">
					<span class="login100-form-title">Member Register</span>

					<div class="wrap-input100 validate-input">
						<input id="username" class="input100" type="text" placeholder="Nama Pengguna..">
						<span class="symbol-input100"><i class="fa fa-user" aria-hidden="true"></i></span>
					</div>

					<div class="wrap-input100 validate-input">
						<input id="email" class="input100" type="email" placeholder="Email..">
						<span class="symbol-input100"><i class="fa fa-envelope" aria-hidden="true"></i></span>
					</div>

					<div class="wrap-input100 validate-input">
						<input id="password" class="input100" type="password" placeholder="Password..">
						<span class="symbol-input100"><i class="fa fa-lock" aria-hidden="true"></i></span>
					</div>
					
					<div class="container-login100-form-btn">
						<button type="submit" class="login100-form-btn">Daftar</button>
					</div>

					<p id="message" class="alert-custom" style="display:none;"></p>

					<div class="text-center p-t-12">
						<a class="txt2" href="index.html">Sudah punya akun? Login di sini</a>
					</div>
				</form>
			</div>
		</div>
	</div>
	<script src="js/register.js"></script>
</body>
</html>
